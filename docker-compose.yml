version: "3.9"

services:

  # ── MySQL Database ──
  mysql:
    image: mysql:8.0
    container_name: voice-ai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: products_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Ollama (LLM Server) ──
  ollama:
    image: ollama/ollama:latest
    container_name: voice-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Ollama Model Setup (runs once to pull llama3) ──
  ollama-setup:
    image: ollama/ollama:latest
    container_name: voice-ai-ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    command: >
      sh -c "echo 'Pulling llama3 model...' && ollama pull llama3 && echo 'Model ready!'"
    restart: "no"

