server:
  port: 8082

spring:
  application:
    name: product-app

  datasource:
    url: jdbc:mysql://localhost:3306/products_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # "validate" — Hibernate checks that the schema matches entities.
    # Flyway owns the schema, so Hibernate must NOT create/alter tables.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.example.product: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG