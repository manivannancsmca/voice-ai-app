server:
  port: 8081

spring:
  application:
    name: mcp-server

  ai:
    mcp:
      server:
        # These metadata values are sent to MCP clients during the handshake
        name: product-mcp-server
        version: 1.0.0

# Base URL of the Product Application REST API.
# In Docker Compose this will be overridden via environment variable.
product-service:
  base-url: http://localhost:8082

logging:
  level:
    com.example.mcpserver: DEBUG
    io.modelcontextprotocol: INFO