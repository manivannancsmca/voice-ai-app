<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Product Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Source+Serif+4:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08080c;
            --surface: #111118;
            --surface-hover: #1a1a24;
            --accent: #22d3ee;
            --accent-dim: #0e7490;
            --accent-glow: rgba(34, 211, 238, 0.15);
            --text: #e8e8ed;
            --text-muted: #6b7280;
            --user-bubble: linear-gradient(135deg, #164e63, #0e7490);
            --ai-bubble: #1a1a28;
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.3);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        header {
            padding: 20px 32px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        header h1 {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.02em;
        }

        header h1 span { color: var(--accent); }

        #status {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #status .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.3s;
        }

        #status.listening .dot { background: var(--danger); animation: pulse-dot 1s infinite; }
        #status.processing .dot { background: var(--accent); animation: pulse-dot 0.8s infinite; }
        #status.speaking .dot { background: #a78bfa; }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* ── Chat Area ── */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: var(--radius);
            font-size: 0.95rem;
            line-height: 1.6;
            animation: fadeUp 0.35s ease forwards;
            opacity: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-bubble);
            border: 1px solid rgba(255,255,255,0.05);
            border-bottom-left-radius: 4px;
        }

        .message.error {
            align-self: center;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            font-size: 0.85rem;
        }

        .message .label {
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
            opacity: 0.6;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Welcome ── */
        #welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-muted);
        }

        #welcome .icon { font-size: 2.5rem; }
        #welcome h2 {
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--text);
        }
        #welcome p { font-size: 0.9rem; text-align: center; max-width: 400px; }

        /* ── Input Area ── */
        #input-area {
            padding: 16px 32px 24px;
            border-top: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }

        #input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 8px 8px 8px 20px;
            transition: border-color 0.2s;
        }

        #input-row:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        #messageInput {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 0.95rem;
            padding: 8px 0;
        }

        #messageInput::placeholder { color: var(--text-muted); }

        .btn {
            width: 44px; height: 44px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        #sendBtn {
            background: var(--accent);
            color: var(--bg);
        }

        #sendBtn:hover { filter: brightness(1.15); transform: scale(1.05); }
        #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        #micBtn {
            background: var(--surface-hover);
            color: var(--text-muted);
            position: relative;
        }

        #micBtn:hover { color: var(--text); background: rgba(255,255,255,0.1); }

        #micBtn.recording {
            background: var(--danger);
            color: white;
            animation: pulse-mic 1.2s infinite;
        }

        @keyframes pulse-mic {
            0%, 100% { box-shadow: 0 0 0 0 var(--danger-glow); }
            50% { box-shadow: 0 0 0 12px transparent; }
        }

        #ttsToggle {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
            cursor: pointer;
            user-select: none;
        }

        #ttsToggle input { accent-color: var(--accent); }

        /* ── Scrollbar ── */
        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-track { background: transparent; }
        #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            header, #chat, #input-area { padding-left: 16px; padding-right: 16px; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>

<header>
    <h1><span>&#9670;</span> Product Assistant</h1>
    <div id="status">
        <div class="dot"></div>
        <span id="statusText">Ready</span>
    </div>
</header>

<div id="chat">
    <div id="welcome">
        <div class="icon">&#127911;</div>
        <h2>Voice-Enabled Product Assistant</h2>
        <p>Click the microphone to speak, or type a question about our products.</p>
    </div>
</div>

<div id="input-area">
    <div id="input-row">
        <input type="text" id="messageInput" placeholder="Ask about products..."
               autocomplete="off" />
        <button class="btn" id="micBtn" title="Hold to speak or click to toggle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10a7 7 0 0 0 14 0"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
        </button>
        <button class="btn" id="sendBtn" title="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
            </svg>
        </button>
    </div>
    <label id="ttsToggle">
        <input type="checkbox" id="ttsCheckbox" checked />
        Read responses aloud
    </label>
</div>

<script>
    // ── DOM Elements ──
    const chatEl       = document.getElementById('chat');
    const welcomeEl    = document.getElementById('welcome');
    const messageInput = document.getElementById('messageInput');
    const sendBtn      = document.getElementById('sendBtn');
    const micBtn       = document.getElementById('micBtn');
    const statusEl     = document.getElementById('status');
    const statusText   = document.getElementById('statusText');
    const ttsCheckbox  = document.getElementById('ttsCheckbox');

    // ── State ──
    let isRecording = false;
    let isProcessing = false;
    let recognition = null;

    // ── Speech Recognition Setup ──
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = false;       // Stop after one utterance
        recognition.interimResults = true;    // Show partial results as user speaks
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
            isRecording = true;
            micBtn.classList.add('recording');
            setStatus('listening', 'Listening...');
        };

        recognition.onresult = (event) => {
            // Show interim (partial) results in the input field
            const transcript = event.results[event.results.length - 1][0].transcript;
            messageInput.value = transcript;

            // When the result is final, send it
            if (event.results[event.results.length - 1].isFinal) {
                sendMessage(transcript.trim());
            }
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            if (event.error === 'not-allowed') {
                addMessage('error', 'Microphone access denied. Please allow microphone permissions.');
            }
            stopRecording();
        };

        recognition.onend = () => {
            stopRecording();
        };
    } else {
        // Hide mic button if speech recognition is not supported
        micBtn.style.display = 'none';
        console.warn('Speech Recognition API not supported in this browser.');
    }

    // ── Mic Button ──
    micBtn.addEventListener('click', () => {
        if (!recognition) return;
        if (isRecording) {
            recognition.stop();
        } else {
            messageInput.value = '';
            try { recognition.start(); } catch (e) { /* already started */ }
        }
    });

    function stopRecording() {
        isRecording = false;
        micBtn.classList.remove('recording');
        setStatus('idle', 'Ready');
    }

    // ── Send Button & Enter Key ──
    messageInput.addEventListener('input', () => {
        sendBtn.disabled = !messageInput.value.trim() || isProcessing;
    });

    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && messageInput.value.trim() && !isProcessing) {
            e.preventDefault();
            sendMessage(messageInput.value.trim());
        }
    });

    sendBtn.addEventListener('click', () => {
        if (messageInput.value.trim() && !isProcessing) {
            sendMessage(messageInput.value.trim());
        }
    });

    // ── Send Message to Backend ──
    async function sendMessage(text) {
        if (!text || isProcessing) return;

        // Hide the welcome screen
        if (welcomeEl) welcomeEl.style.display = 'none';

        // Show user message
        addMessage('user', text);
        messageInput.value = '';
        sendBtn.disabled = true;
        isProcessing = true;
        setStatus('processing', 'Thinking...');

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            const data = await res.json();

            if (res.ok && data.response) {
                addMessage('ai', data.response);
                // Read aloud if TTS is enabled
                if (ttsCheckbox.checked) {
                    speak(data.response);
                }
            } else {
                addMessage('error', data.error || 'Unknown error occurred');
            }
        } catch (err) {
            console.error('Chat error:', err);
            addMessage('error', 'Could not reach the server. Is the MCP Client running?');
        } finally {
            isProcessing = false;
            sendBtn.disabled = !messageInput.value.trim();
            setStatus('idle', 'Ready');
        }
    }

    // ── Add Message to Chat ──
    function addMessage(type, text) {
        const div = document.createElement('div');
        div.className = `message ${type}`;

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = type === 'user' ? 'You' : type === 'ai' ? 'Assistant' : 'Error';

        const content = document.createElement('div');
        content.textContent = text;

        div.appendChild(label);
        div.appendChild(content);
        chatEl.appendChild(div);

        // Scroll to bottom
        chatEl.scrollTop = chatEl.scrollHeight;
    }

    // ── Text-to-Speech ──
    function speak(text) {
        if (!('speechSynthesis' in window)) return;

        // Cancel any ongoing speech
        speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        utterance.onstart = () => setStatus('speaking', 'Speaking...');
        utterance.onend = () => setStatus('idle', 'Ready');
        utterance.onerror = () => setStatus('idle', 'Ready');

        speechSynthesis.speak(utterance);
    }

    // ── Status Helper ──
    function setStatus(state, text) {
        statusEl.className = state;
        statusText.textContent = text;
    }
</script>
</body>
</html>
